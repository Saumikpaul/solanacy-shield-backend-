services:
  - type: web
    name: solanacy-shield-backend
    env: python
    region: singapore
    plan: free

    buildCommand: |
      apt-get update && apt-get install -y nmap && pip install -r requirements.txt

    startCommand: python -m gunicorn main:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT --log-level info

    healthCheckPath: /ping

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMMA_MODEL
        value: gemma-4-31b-it

      - key: SAFE_BROWSING_API_KEY
        sync: false

      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false
